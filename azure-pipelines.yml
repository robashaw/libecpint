trigger:
- main

pr:
- main

jobs:
# Configure, build and test job
- job: 'linux_build'
  displayName: 'Linux Builds'
  pool:
    vmImage: 'ubuntu-latest'
  timeoutInMinutes: 30
  variables:
    CTEST_OUTPUT_ON_FAILURE: 1
  strategy:
    matrix:
      gcc_latest:
        CXX_COMPILER: 'g++'
        CXX_FLAGS: "-O3 -fprofile-arcs -ftest-coverage"
        C_COMPILER: 'gcc'
        BUILD_TYPE: 'release'
        COVERAGE: 'true'

      clang_latest:
        CXX_COMPILER: 'clang++'
        CXX_FLAGS: "-O3"
        C_COMPILER: 'clang'
        BUILD_TYPE: 'release'
        COVERAGE: 'false'

  steps:
  - checkout: self
    displayName: "Checkout repos"
  - bash: |
      set -euo pipefail
      command -v ${CXX_COMPILER}
      command -v ${C_COMPILER}
      echo "Build reason: $(Build.Reason)"
      echo "" && echo "Ubuntu"
      lsb_release -a
      echo "" && echo "Uname:"
      uname -a
      echo "" && echo "Free:"
      free -m
      echo "" && echo "df:"
      df -h
      echo "" && echo "Ulimit:"
      ulimit -a
      echo "" && echo "Nprocs:"
      getconf _NPROCESSORS_ONLN
      echo "CXX Ver:"
      ${CXX_COMPILER} --version
      echo "C Ver:"
      ${C_COMPILER} --version
    displayName: 'Build Environment'
  - bash: |
      set -euo pipefail
      cmake -S . -B build \
        -DCMAKE_C_COMPILER=${C_COMPILER} \
        -DCMAKE_CXX_COMPILER=${CXX_COMPILER} \
        -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
        -DCMAKE_CXX_FLAGS="${CXX_FLAGS}" \
        -DLIBECPINT_MAX_UNROL=1
    displayName: 'Configure Build'
  - bash: |
      set -euo pipefail
      cmake --build build --parallel $(nproc)
    displayName: 'Build'
  - bash: |
      set -euo pipefail
      ctest --test-dir build --output-on-failure -j $(nproc)
    displayName: 'Tests'
  - bash: |
      set -euo pipefail
      # Unset secrets are passed through as the literal "$(CODECOV_TOKEN)", and PRs from forks get none
      if [[ -z "${CODECOV_TOKEN}" || "${CODECOV_TOKEN}" == '$(CODECOV_TOKEN)' ]]; then
        echo "No CODECOV_TOKEN available, skipping the upload"
        exit 0
      fi
      curl -Os https://cli.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov upload-process -t "${CODECOV_TOKEN}"
    displayName: 'Upload to codecov.io'
    env:
      CODECOV_TOKEN: $(CODECOV_TOKEN)
    continueOnError: true
    condition: and(succeeded(), eq(variables['COVERAGE'], 'true'))
